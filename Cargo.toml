[package]
name = "kepware-bridge"
version = "1.0.0"
edition = "2021"

[dependencies]
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
metrics = "0.24"
metrics-exporter-prometheus = { version = "0.18", default-features = false, features = ["http-listener"] }
opcua = { package = "async-opcua", version = "0.18.0", features = ["client"] }
serde = { version = "1", features = ["derive"] }
serde_yaml = "0.9"
sled = "0.34"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio-rustls", "mysql", "chrono"] }
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
